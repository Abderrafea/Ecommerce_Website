<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>e-commerce.png">
    <link rel="apple-touch-icon" href="<%= BASE_URL %>e-commerce.png">
    <title> BoutikGo - Votre boutique en ligne</title>
    
    <!-- Meta tags pour SEO -->
    <meta name="description" content="Découvrez notre sélection de produits de qualité. Livraison gratuite et service client exceptionnel.">
    <meta name="keywords" content="e-commerce, boutique en ligne, produits, livraison gratuite">
    <meta name="author" content="Mon E-commerce">
    
    <!-- Open Graph tags -->
    <meta property="og:title" content=" Mon E-commerce">
    <meta property="og:description" content="Votre boutique en ligne de confiance">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mon-ecommerce.com">
    
    <!-- Preconnect pour améliorer les performances -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles de base -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        color: #2c3e50;
        background: #f8f9fa;
      }
      
      /* Loading spinner */
      .loading-spinner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        z-index: 9999;
      }
      
      @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
      }
      
      /* Masquer le spinner quand l'app est chargée */
      .app-loaded .loading-spinner,
      .app-loaded .loading-logo {
        display: none;
      }
      
      /* Logo de chargement */
      .loading-logo {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 9998;
      }
      
      .logo-image {
        width: 80px;
        height: 80px;
        margin-bottom: 1rem;
        animation: pulse 2s infinite;
      }
      
      .logo-text {
        font-size: 2rem;
        font-weight: bold;
        color: #0284c7;
        margin: 0;
        font-family: 'Inter', sans-serif;
      }
      
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <!-- Loading spinner avec logo -->
    <div class="loading-spinner" id="loading-spinner"></div>
    <div class="loading-logo" id="loading-logo">
      <img src="<%= BASE_URL %>e-commerce.png" alt="BoutikGo Logo" class="logo-image">
      <h1 class="logo-text">BoutikGo</h1>
    </div>
    
    <noscript>
      <div style="text-align: center; padding: 2rem; background: #e74c3c; color: white;">
        <h2>⚠️ JavaScript requis</h2>
        <p>Cette application nécessite JavaScript pour fonctionner correctement. Veuillez l'activer dans votre navigateur.</p>
      </div>
    </noscript>
    
    <div id="app"></div>
    
    <!-- Script pour masquer le spinner -->
    <script>
      window.addEventListener('load', function() {
        document.body.classList.add('app-loaded');
      });
    </script>
  </body>
</html>
